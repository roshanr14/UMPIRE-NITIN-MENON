<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050713" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#050713" />
    </linearGradient>

    <!-- Neon Cyan & Indigo Radial -->
    <radialGradient id="cyanGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="roseGlow" cx="70%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </radialGradient>

    <!-- Ball Body Gradient -->
    <linearGradient id="ballGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="40%" stop-color="#d50000" />
      <stop offset="85%" stop-color="#880e4f" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>

    <!-- Glass Shield Gradient -->
    <linearGradient id="glassShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.06" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcee0a" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Ambient Ambient Glows -->
  <circle cx="256" cy="200" r="180" fill="url(#cyanGlow)" />
  <circle cx="340" cy="340" r="150" fill="url(#roseGlow)" />

  <!-- Outer Glass Boundary Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#glassShield)" stroke-width="3" stroke-dasharray="16,8" opacity="0.6" />
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" />

  <!-- Glowing Hexagonal Shield Shield -->
  <path d="M256 70 L410 130 L410 320 Q410 430 256 460 Q102 430 102 320 L102 130 Z" 
        fill="url(#glassShield)" 
        stroke="#00f0ff" 
        stroke-width="3.5" 
        filter="url(#neonBlur)" />

  <!-- Central Cricket Ball -->
  <circle cx="256" cy="260" r="105" fill="url(#ballGrad)" stroke="#fcee0a" stroke-width="2.5" />

  <!-- Ball Seam & Stitches -->
  <path d="M200 170 Q256 260 200 350" stroke="#ffffff" stroke-width="5" fill="none" stroke-dasharray="8,5" opacity="0.95" />
  <path d="M312 170 Q256 260 312 350" stroke="#00f0ff" stroke-width="5" fill="none" stroke-dasharray="8,5" opacity="0.85" />
  <line x1="256" y1="155" x2="256" y2="365" stroke="#fcee0a" stroke-width="4" stroke-dasharray="10,6" opacity="0.9" />

  <!-- Ball Highlight Sheen -->
  <ellipse cx="225" cy="220" rx="35" ry="20" transform="rotate(-30 225 220)" fill="#ffffff" opacity="0.35" />

  <!-- Stumps / Bails Modern Cyber Emblem -->
  <g transform="translate(196, 120)" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round">
    <!-- Bails -->
    <line x1="10" y1="0" x2="110" y2="0" filter="url(#neonBlur)" />
    <!-- Three Stumps -->
    <line x1="20" y1="0" x2="20" y2="55" />
    <line x1="60" y1="0" x2="60" y2="55" />
    <line x1="100" y1="0" x2="100" y2="55" />
  </g>

  <!-- Crown / Star Accent -->
  <polygon points="256,76 264,96 286,96 268,108 274,128 256,116 238,128 244,108 226,96 248,96" fill="url(#goldGrad)" filter="url(#neonBlur)" />

  <!-- Live Pulse Dot -->
  <circle cx="390" cy="140" r="10" fill="#00f0ff" filter="url(#neonBlur)" />
  <circle cx="390" cy="140" r="18" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5" />
</svg>
